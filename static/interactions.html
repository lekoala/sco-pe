<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sco-pe — interactions demo</title>
  <link rel="stylesheet" href="demo.css">
  <script type="module" src="../sco-pe.js"></script>
</head>
<body>
  <nav><a href="index.html">All demos</a></nav>
  <h1>Autosubmit, scroll and transition</h1>
  <p>Type in the filter, scroll the product list, then use the link. The list keeps its position while the outgoing content fades.</p>
  <div id="scope-status" role="status" aria-live="polite" aria-atomic="true"></div>
  <sco-pe id="catalog" src="/demo/catalog" history="true" autosubmit="250" scroll="keep" transition="fade" transition-timeout="180"><p>Loading catalogue…</p></sco-pe>
</body>
</html>
